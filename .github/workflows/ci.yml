name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kdipl_test
          POSTGRES_USER: kdipl
          POSTGRES_PASSWORD: kdipl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdipl -d kdipl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kdipl:kdipl_test@localhost:5432/kdipl_test?schema=public
      TEST_DATABASE_URL: postgresql://kdipl:kdipl_test@localhost:5432/kdipl_test?schema=public
      APP_URL: http://127.0.0.1:3000
      RUN_DATABASE_TESTS: "1"
      BOOTSTRAP_ADMIN_EMAIL: e2e-admin@kdipl.test
      BOOTSTRAP_ADMIN_NAME: KDIPL Test Administrator
      FILE_STORAGE_PROVIDER: local
      FILE_STORAGE_LOCAL_PATH: .data/uploads
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral test secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DEMO_BUSINESS_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
