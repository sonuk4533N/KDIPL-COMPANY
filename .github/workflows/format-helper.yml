name: Phase 5 Format Helper

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-formatted-files
          path: |
            src/app/(app)/inventory/page.tsx
            src/features/inventory/goods-receipt-form.tsx
            src/features/inventory/grn-draft-controls.tsx
            src/features/inventory/grn-exception-controls.tsx
            src/features/inventory/inventory-actions.ts
            src/features/inventory/inventory-completion-actions.ts
            src/features/inventory/inventory-completion-service.ts
            src/features/inventory/inventory-queries.ts
            src/features/inventory/inventory-schemas.ts
            src/features/inventory/inventory-service.ts
            src/features/inventory/purchase-order-controls.tsx
            tests/integration/phase5-completion.test.ts
