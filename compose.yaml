services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kdipl
      POSTGRES_USER: kdipl
      POSTGRES_PASSWORD: kdipl_dev
    ports:
      - "5432:5432"
    volumes:
      - kdipl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdipl -d kdipl"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kdipl_test
      POSTGRES_USER: kdipl
      POSTGRES_PASSWORD: kdipl_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdipl -d kdipl_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kdipl-postgres:
